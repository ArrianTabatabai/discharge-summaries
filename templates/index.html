<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discharge Summary Generator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Discharge Summary Generator</h1>
        <form id="summaryForm">
            <textarea id="inputText" name="inputText" rows="10" placeholder="Paste patient documents here..."></textarea>
            <button type="submit">Generate Summary</button>
        </form>

        <div id="result">
            <h2>Generated Summary</h2>
            <p id="summaryText"></p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $('#summaryForm').on('submit', function(event) {
            event.preventDefault(); 
            
            // Get the input text
            var inputText = $('#inputText').val();
            
            // Send the input to the server for summarization
            $.post('/summarize', {inputText: inputText}, function(response) {
                // Display the generated summary
                $('#summaryText').text(response.summary);
            });
        });
    </script>
</body>
</html>
